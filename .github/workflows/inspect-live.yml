name: Inspect live Cloudflare OS

on:
  push:
    branches: [codex/verify-20261004]

permissions:
  contents: write
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read deployed service configuration and public endpoint status
        env:
          CFOS_DEPLOY_CREDENTIALS: ${{ secrets.CFOS_DEPLOY_CREDENTIALS }}
          GH_ACTION_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse, re, base64
          from pathlib import Path
          credentials = json.loads(os.environ['CFOS_DEPLOY_CREDENTIALS'])
          token = credentials['CLOUDFLARE_API_TOKEN']
          account = '9ae12807d5b18bf3d1bcbe38b9050e05'
          origin = 'https://hellgate-os-router.mchayes89.workers.dev'
          report = {'configured_origin': origin, 'requests': {}}
          gh_headers = {'Authorization': 'Bearer ' + os.environ['GH_ACTION_TOKEN'], 'Accept': 'application/vnd.github+json'}
          old_run = 'https://api.github.com/repos/Cirrefera/cloudflare-os-starter/actions/runs/37229847895'
          try:
              with urllib.request.urlopen(urllib.request.Request(old_run + '/jobs', headers=gh_headers), timeout=20) as response:
                  jobs = json.load(response)['jobs']
              steps = [step for job in jobs for step in job.get('steps', []) if step.get('name') == 'Deploy the configured OS and four custom gatekeepers']
              if steps and all(step.get('status') == 'queued' for step in steps):
                  request = urllib.request.Request(old_run + '/cancel', headers=gh_headers, method='POST')
                  with urllib.request.urlopen(request, timeout=20) as response:
                      report['superseded_run_cancelled_before_deployment'] = response.status == 202
          except Exception:
              report['superseded_run_cancellation'] = 'not needed or not available'
          def api(path):
              req = urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/' + account + path,
                  headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.load(response)
                  report['requests'][path] = {'http_status': response.status, 'success': data.get('success', False)}
                  return data.get('result') if data.get('success') else None
              except urllib.error.HTTPError as error:
                  report['requests'][path] = {'http_status': error.code}
              except Exception:
                  report['requests'][path] = {'error': 'request failed'}
              return None
          subdomain = api('/workers/subdomain')
          if subdomain:
              report['workers_subdomain'] = subdomain.get('subdomain')
          workers = api('/workers/scripts')
          if workers is not None:
              report['os_workers'] = sorted(w['id'] for w in workers if w['id'].startswith('hellgate-os-'))
          report['bootstrap'] = {}
          draft_boundary = 'cfosbootstrap20261004'
          metadata = json.dumps({'main_module': 'bootstrap.js', 'compatibility_date': '2026-10-03', 'bindings': []})
          draft = ('--' + draft_boundary + '\r\nContent-Disposition: form-data; name="metadata"\r\nContent-Type: application/json\r\n\r\n' + metadata +
              '\r\n--' + draft_boundary + '\r\nContent-Disposition: form-data; name="bootstrap.js"; filename="bootstrap.js"\r\nContent-Type: application/javascript+module\r\n\r\nexport default {fetch(){return new Response("Deployment in progress",{status:503});}};\r\n--' + draft_boundary + '--\r\n').encode()
          installed = {worker['id'] for worker in workers or []}
          selected = None
          for name in ['hellgate-os-gatekeeper-cloudflareaccount', 'hellgate-os-gatekeeper-snowflake']:
              if name in installed:
                  report['bootstrap'][name] = 'already exists; not changed'
                  continue
              for key in ([selected] if selected else ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_GATEKEEPER_TOKEN']):
                  request = urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/scripts/' + name,
                      data=draft, method='PUT', headers={'Authorization': 'Bearer ' + credentials[key], 'Content-Type': 'multipart/form-data; boundary=' + draft_boundary})
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          data = json.load(response)
                          report['bootstrap'][name + ':' + key] = {'http_status': response.status, 'success': data.get('success', False)}
                      if data.get('success'):
                          selected = key
                          report['bootstrap_auth_key'] = key
                          break
                  except urllib.error.HTTPError as error:
                      try:
                          data = json.load(error)
                          details = [{'code': item.get('code'), 'message': str(item.get('message', ''))[:180]} for item in data.get('errors', [])]
                      except Exception:
                          details = []
                      report['bootstrap'][name + ':' + key] = {'http_status': error.code, 'errors': details}
                  except Exception:
                      report['bootstrap'][name + ':' + key] = {'error': 'bootstrap request failed'}
              else:
                  break
          if selected:
              token = credentials[selected]
              report['os_workers'] = sorted(worker['id'] for worker in api('/workers/scripts') or [] if worker['id'].startswith('hellgate-os-'))
          report['services'] = {}
          for name in ['hellgate-os-router', 'hellgate-os-workshop']:
              settings = api('/workers/scripts/' + name + '/settings')
              if settings:
                  report['services'][name] = {b['name']: b.get('service') for b in settings.get('bindings', []) if b.get('type') == 'service'}
          report['secret_names'] = {}
          for integration in ['snowflake', 'cloudflareaccount']:
              secrets = api('/workers/scripts/hellgate-os-gatekeeper-' + integration + '/secrets')
              if secrets is not None:
                  report['secret_names'][integration] = sorted(s['name'] for s in secrets)
          report['endpoints'] = {}
          origins = {origin}
          if report.get('workers_subdomain'):
              origins.add('https://hellgate-os-router.' + report['workers_subdomain'] + '.workers.dev')
          for host in sorted(origins):
              for path in ['/', '/gatekeeper/huggingface/.well-known/oauth-cimd', '/gatekeeper/snowflake/oauth', '/gatekeeper/huggingface/oauth']:
                  url = host + path
                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          result = {'http_status': response.status, 'content_type': response.headers.get('Content-Type', ''), 'response_host': urllib.parse.urlparse(response.url).hostname}
                          if path.endswith('oauth-cimd') and 'application/json' in result['content_type']:
                              metadata = json.load(response)
                              result['metadata'] = {k: metadata.get(k) for k in ['client_id', 'redirect_uris', 'token_endpoint_auth_method']}
                      report['endpoints'][url] = result
                  except urllib.error.HTTPError as error:
                      report['endpoints'][url] = {'http_status': error.code}
                  except Exception:
                      report['endpoints'][url] = {'error': 'request failed'}
          output = json.dumps(report, indent=2) + '\n'
          if any(value in output for value in credentials.values()):
              raise SystemExit('Credential match in status report; refusing to publish.')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file, code, message, headers, newurl):
                  return None
          request = urllib.request.Request('https://api.github.com/repos/Cirrefera/cloudflare-os-starter/actions/jobs/111517700545/logs',
              headers={'Authorization': 'Bearer ' + os.environ['GH_ACTION_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              try:
                  response = urllib.request.build_opener(NoRedirect).open(request, timeout=30)
                  logs = response.read().decode(errors='replace')
              except urllib.error.HTTPError as error:
                  if error.code != 302:
                      raise
                  logs = urllib.request.urlopen(error.headers['Location'], timeout=30).read().decode(errors='replace')
              for value in list(credentials.values()) + [os.environ['GH_ACTION_TOKEN']]:
                  for form in [value, urllib.parse.quote(value, safe=''), base64.b64encode(value.encode()).decode()]:
                      logs = logs.replace(form, '***')
              logs = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', logs)
              logs = '\n'.join(logs.splitlines()[-500:]) + '\n'
              if any(value in logs for value in credentials.values()):
                  raise RuntimeError('Credential match')
              Path('deployment-command.log').write_text(logs)
          except Exception:
              report['deployment_log'] = 'Could not retrieve credential-safe job log.'
          Path('deployment-live-status.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Publish credential-free deployment status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-live-status.json
          if [ -f deployment-command.log ]; then git add deployment-command.log; fi
          git commit -m 'Record live Worker wiring and public endpoint status'
          git push origin HEAD:refs/heads/codex/deployment-status-${{ github.run_id }}
